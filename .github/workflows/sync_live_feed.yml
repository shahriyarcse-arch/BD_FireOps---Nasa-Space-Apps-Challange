name: sync-live-feed

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

concurrency:
  group: sync-live-feed
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest NASA FIRMS satellite snapshot
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "FIRMS_MAP_KEY secret not set; skipping live network fetch."
            exit 0
          fi
          python tools/fetch_live.py

      - name: Embed live snapshot and verify integrity
        run: |
          python tools/sync_web.py
          node --check app.js
          python tools/e2e_audit.py

      - name: Commit and push updated telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/live_feed.json app.js
          if git diff --staged --quiet; then
            echo "No new satellite detections. Feed is already up to date."
          else
            git commit -m "chore(telemetry): auto-sync NASA FIRMS live NRT satellite snapshot [skip ci]"
            git push
          fi
