name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generated blocks in sync (README + web)
        run: |
          python tools/sync_readme.py --check
          python tools/sync_web.py --check

      - name: JavaScript syntax
        run: node --check app.js

      - name: Fixture pipeline end-to-end (synthetic, no API key)
        run: python tests/test_pipeline.py

      - name: Shipped bootstrap interval is reproducible
        run: python tools/verify_bootstrap.py

      - name: End-to-end frontend audit (35 consistency checks)
        run: python tools/e2e_audit.py
